name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: sharereading
          POSTGRES_DB: sharereading
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharereading -d sharereading"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://sharereading:ci_only_password@127.0.0.1:5432/sharereading

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # README의 "빌드 및 검증" 절차: 운영 서버를 띄워 시작 화면과 DB 상태 확인 API를 호출
      - name: Smoke test
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:3000 && break
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:3000 > /dev/null
          curl --fail --silent --show-error http://localhost:3000/api/health

      - if: failure()
        run: cat server.log || true
